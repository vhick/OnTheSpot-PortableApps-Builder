name: Optional Manual Maintenance Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only upstream and shared-action report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/maintenance.py
      - uses: actions/upload-artifact@v4
        with:
          name: OnTheSpot-maintenance-${{ github.run_id }}
          path: maintenance-report.json
          retention-days: 3
